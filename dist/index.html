<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="一款纯本地运行、数据保存为 JSON 文件的工作记事本。"
    />
    <meta name="theme-color" content="#f5f1e8" />
    <title>xxsNote · 本地记事本</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="笔记列表">
        <div class="brand-row">
          <a class="brand" href="#" aria-label="xxsNote 首页">
            <span class="brand-mark" aria-hidden="true">x</span>
            <span>
              <strong>xxsNote</strong>
              <small>LOCAL NOTES</small>
            </span>
          </a>
          <button class="icon-button sidebar-close" id="closeSidebar" type="button" aria-label="关闭笔记列表">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </div>

        <button class="new-note-button" id="newNoteButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          <span>新建笔记</span>
          <kbd>Ctrl N</kbd>
        </button>

        <label class="search-box" for="searchInput">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4 4" /></svg>
          <input id="searchInput" type="search" placeholder="搜索笔记" autocomplete="off" />
          <button id="clearSearch" type="button" aria-label="清空搜索" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" /></svg>
          </button>
        </label>

        <section class="groups-panel" aria-label="笔记分组">
          <div class="groups-heading">
            <button class="groups-toggle" id="groupsToggle" type="button" aria-expanded="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4" /></svg>
              <span>分组</span>
            </button>
            <button class="group-add-button" id="addGroupButton" type="button" aria-label="新增分组">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            </button>
          </div>
          <div class="groups-list" id="groupsList"></div>
        </section>

        <div class="sidebar-foot">
          <span class="local-dot" aria-hidden="true"></span>
          <span>按日期分目录保存</span>
          <span class="app-version" id="appVersion">v1.1.2</span>
        </div>
      </aside>

      <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="关闭笔记列表"></button>

      <main class="workspace">
        <header class="topbar">
          <button class="icon-button menu-button" id="openSidebar" type="button" aria-label="打开笔记列表">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
          </button>
          <div class="save-state" id="saveState" role="status" aria-live="polite">
            <span class="save-dot" aria-hidden="true"></span>
            <span>已保存</span>
          </div>
          <div class="toolbar">
            <button class="text-button" id="pinButton" type="button" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4 6 0 1 5 3 3v2h-6v6l-1 1-1-1v-6H5v-2l3-3 1-5Z" /></svg>
              <span>置顶</span>
            </button>
            <button class="text-button danger-button" id="deleteButton" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M9 7V4h6v3M8 10v8M12 10v8M16 10v8M7 7l1 14h8l1-14" /></svg>
              <span>删除</span>
            </button>
            <button class="icon-button more-button" type="button" aria-label="更多操作">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /></svg>
            </button>
          </div>
        </header>

        <section class="editor" id="editorPanel" aria-label="笔记编辑器">
          <div class="editor-card">
            <div class="editor-accent" aria-hidden="true"></div>
            <input
              class="title-input"
              id="titleInput"
              type="text"
              maxlength="80"
              placeholder="笔记标题"
              aria-label="笔记标题"
            />

            <div class="note-details" aria-label="笔记信息">
              <label class="group-select-label">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h6l2 2h9v9.5h-17z" /><path d="M3.5 7.5V5h6l2 2" /></svg>
                <select id="noteGroupSelect" aria-label="所属分组"></select>
              </label>
              <span class="detail-separator" aria-hidden="true"></span>
              <span class="note-detail">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="2" /><path d="M8 3v5M16 3v5M4 10h16" /></svg>
                <time id="createdDate"></time>
              </span>
              <span class="detail-separator" aria-hidden="true"></span>
              <span class="note-detail">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M12 7v5l3 2" /></svg>
                <span id="lastEditedTime"></span>
              </span>
            </div>

            <div class="format-toolbar" role="toolbar" aria-label="文本格式">
              <select class="style-select" id="styleSelect" aria-label="段落样式">
                <option value="body">正文</option>
                <option value="heading">标题</option>
              </select>
              <span class="toolbar-separator" aria-hidden="true"></span>
              <button type="button" data-format="bold" aria-label="加粗"><strong>B</strong></button>
              <button type="button" data-format="italic" aria-label="斜体"><em>I</em></button>
              <span class="toolbar-separator" aria-hidden="true"></span>
              <button type="button" data-format="bullet" aria-label="无序列表">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="7" r="1" /><circle cx="5" cy="12" r="1" /><circle cx="5" cy="17" r="1" /><path d="M9 7h10M9 12h10M9 17h10" /></svg>
              </button>
              <button type="button" data-format="number" aria-label="有序列表">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7h10M9 12h10M9 17h10M4 6h1v3M4 13h2l-2 3h2" /></svg>
              </button>
              <button type="button" data-format="check" aria-label="待办事项">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" /><path d="m8 12 3 3 5-6" /></svg>
              </button>
              <span class="toolbar-separator" aria-hidden="true"></span>
              <button type="button" data-format="quote" aria-label="引用">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h5v5H7v5H4v-7a3 3 0 0 1 1-3ZM14 7h5v5h-3v5h-3v-7a3 3 0 0 1 1-3Z" /></svg>
              </button>
              <button type="button" data-format="divider" aria-label="分隔线">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16" /></svg>
              </button>
              <button type="button" data-format="link" aria-label="链接">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 14.5 5-5M7 16l-1 1a3.5 3.5 0 0 1-5-5l3-3a3.5 3.5 0 0 1 5 0M17 8l1-1a3.5 3.5 0 0 1 5 5l-3 3a3.5 3.5 0 0 1-5 0" /></svg>
              </button>
            </div>

            <div class="content-editor-wrap">
              <button class="quick-insert" id="quickInsert" type="button" aria-label="插入新段落">+</button>
              <textarea
                class="content-input"
                id="contentInput"
                placeholder="从这里开始记录……"
                aria-label="笔记内容"
                spellcheck="false"
              ></textarea>
            </div>

            <footer class="editor-meta">
              <span class="editor-storage-state">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5" /><path d="M18.5 12a7 7 0 0 0-12-4L4 10M5.5 12a7 7 0 0 0 12 4l2.5-2" /></svg>
                自动保存&nbsp; · &nbsp;本地 JSON
              </span>
              <span>
                <span id="characterCount">0 字</span>
                <span class="meta-divider" aria-hidden="true"></span>
                <span id="paragraphCount">0 段</span>
              </span>
            </footer>
          </div>
        </section>

        <section class="empty-editor" id="emptyEditor" hidden>
          <div class="empty-illustration" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <h1>还没有笔记</h1>
          <p>把待办、灵感或工作记录留在这里。</p>
          <button class="empty-new-button" id="emptyNewButton" type="button">写第一篇笔记</button>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden>
      <span>笔记已删除</span>
      <button id="undoDelete" type="button">撤销</button>
    </div>

    <dialog class="group-dialog" id="groupDialog">
      <form method="dialog" id="groupForm">
        <div class="dialog-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3.5 7.5h6l2 2h9v9.5h-17z" /><path d="M3.5 7.5V5h6l2 2" /></svg>
        </div>
        <h2>新建分组</h2>
        <p>为相关笔记创建一个简洁的分类。</p>
        <label for="groupNameInput">分组名称</label>
        <input id="groupNameInput" name="groupName" maxlength="20" placeholder="例如：项目记录" autocomplete="off" />
        <div class="dialog-actions">
          <button class="dialog-cancel" value="cancel" type="button" id="cancelGroupButton">取消</button>
          <button class="dialog-confirm" value="confirm" type="submit">创建分组</button>
        </div>
      </form>
    </dialog>

    <dialog class="group-dialog delete-dialog" id="deleteDialog" aria-labelledby="deleteDialogTitle">
      <form method="dialog" id="deleteForm">
        <div class="dialog-icon dialog-icon-danger" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M8 10v8M12 10v8M16 10v8M7 7l1 14h8l1-14" /></svg>
        </div>
        <h2 id="deleteDialogTitle">确认删除笔记？</h2>
        <p class="delete-dialog-copy">
          即将删除“<strong id="deleteNoteTitle">无标题笔记</strong>”。删除后仍可通过底部提示撤销。
        </p>
        <div class="dialog-actions">
          <button class="dialog-cancel" value="cancel" type="button" id="cancelDeleteButton" autofocus>取消</button>
          <button class="dialog-confirm dialog-danger" value="confirm" type="submit">确认删除</button>
        </div>
      </form>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
